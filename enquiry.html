<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry | Define By Nature</title>
</head>
<body>
    <header>
        <h1>Define By Nature</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Products & Services</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="enquiry-section">
            <h2>Product & Wholesale Enquiries</h2>
            <p>Submit your inquiries regarding custom garment orders, bulk wholesale, or sizing assistance below.</p>

            <form action="#" method="post">
                <div>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div>
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="enquiry-type">Enquiry Type:</label>
                    <input type="text" id="enquiry-type" name="enquiry-type" placeholder="Sizing, Wholesale, Sponsorship">
                </div>
                <div>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <div>
                    <button type="submit">Submit Enquiry</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Define By Nature. All rights reserved.</p>
    </footer>
</body>
</html>
